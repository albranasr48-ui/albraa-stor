<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - المتجر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- استدعاء مكتبة Supabase للربط السحابي -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = 'https://aqfokdrpdxhxnxqgrcha.supabase.co';
  const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFxZm9rZHJwZHhoeG54cWdyY2hhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEwODYwOTgsImV4cCI6MjEwNjY2MjA5OH0.VpZJxeKNI_SOTgC7Sp4hnfaNat1TSiJg8IfFUNtHfwM';
  
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
</script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen">

    <header class="bg-slate-800 border-b border-slate-700 py-4 px-6 flex justify-between items-center sticky top-0 z-40">
        <h1 class="text-xl font-black text-amber-400 flex items-center">
            <i class="fa-solid fa-sliders ml-2"></i> لوحة التحكم بالمتجر
        </h1>
        <a href="index.html" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-sm font-bold transition flex items-center shadow">
            <i class="fa-solid fa-eye ml-1"></i> عرض المتجر
        </a>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 space-y-10">
        <!-- إضافة وتعديل منتج -->
        <section class="bg-slate-800 p-6 md:p-8 rounded-3xl border border-slate-700 shadow-xl">
            <h2 id="form-title" class="text-2xl font-bold mb-6 text-emerald-400 flex items-center justify-end">
                إضافة منتج جديد <i class="fa-solid fa-circle-plus mr-2"></i>
            </h2>
            <form id="product-form" onsubmit="saveProduct(event)" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <input type="hidden" id="edit-id" value="">
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300 text-right">اسم المنتج</label>
                    <input type="text" id="p-name" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-right">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300 text-right">السعر (د.ل)</label>
                    <input type="number" step="0.01" id="p-price" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-right">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300 text-right">القسم</label>
                    <select id="p-category" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-right"></select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300 text-right">حالة التوفر</label>
                    <select id="p-status" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-right">
                        <option value="متوفر">متوفر</option>
                        <option value="غير متوفر">غير متوفر</option>
                        <option value="نفذت الكمية">نفذت الكمية</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300 text-right">نسبة الخصم (%) - اختيارية</label>
                    <input type="number" id="p-discount" min="0" max="100" placeholder="مثال: 15" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-right">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2 text-slate-300 text-right">رابط صورة المنتج (أو اتركها فارغة)</label>
                    <input type="text" id="p-image-url" placeholder="https://example.com/image.jpg" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 text-right">
                </div>
                
                <!-- الألوان -->
                <div class="md:col-span-2 bg-slate-900/50 p-4 rounded-2xl border border-slate-700">
                    <label class="block text-sm font-semibold mb-2 text-slate-300 text-right">الألوان (أكتب اللون واضغط إضافة، أو افصل بينها بفواصل)</label>
                    <div class="flex gap-2 mb-3">
                        <button type="button" onclick="addColor()" class="bg-slate-700 hover:bg-slate-600 px-5 py-2 rounded-xl text-sm font-bold">إضافة اللون</button>
                        <input type="text" id="new-color-input" placeholder="مثال: أحمر, أزرق" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-emerald-500 text-right">
                    </div>
                    <div id="colors-tags" class="flex flex-wrap gap-2 justify-end"></div>
                </div>
                
                <!-- المقاسات -->
                <div class="md:col-span-2 bg-slate-900/50 p-4 rounded-2xl border border-slate-700">
                    <label class="block text-sm font-semibold mb-2 text-slate-300 text-right">المقاسات (أكتب المقاس واضغط إضافة، أو افصل بينها بفواصل)</label>
                    <div class="flex gap-2 mb-3">
                        <button type="button" onclick="addSize()" class="bg-slate-700 hover:bg-slate-600 px-5 py-2 rounded-xl text-sm font-bold">إضافة المقاس</button>
                        <input type="text" id="new-size-input" placeholder="مثال: S, M, L, XL" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-white text-sm focus:outline-none focus:border-emerald-500 text-right">
                    </div>
                    <div id="sizes-tags" class="flex flex-wrap gap-2 justify-end"></div>
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-semibold mb-2 text-slate-300 text-right">وصف المنتج</label>
                    <textarea id="p-desc" rows="3" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 text-right" placeholder="تفاصيل المنتج..."></textarea>
                </div>

                <div class="md:col-span-2 flex gap-4">
                    <button type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl transition shadow">حفظ المنتج</button>
                    <button type="button" onclick="resetProductForm()" id="cancel-edit-btn" class="hidden bg-slate-700 hover:bg-slate-600 px-6 py-3.5 rounded-xl font-bold transition">إلغاء</button>
                </div>
            </form>
        </section>

        <!-- المنتجات الحالية -->
        <section class="bg-slate-800 p-6 md:p-8 rounded-3xl border border-slate-700 shadow-xl">
            <h2 class="text-xl font-bold mb-4 text-emerald-400 text-right">
                المنتجات الحالية <i class="fa-solid fa-boxes-stacked mr-2"></i>
            </h2>
            <div id="admin-products-list" class="space-y-3 max-h-96 overflow-y-auto pr-2"></div>
        </section>

        <!-- الأقسام والإعدادات -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
            <section class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                <h2 class="text-xl font-bold mb-4 text-emerald-400 text-right">
                    إدارة الأقسام <i class="fa-solid fa-folder-tree mr-2"></i>
                </h2>
                <div class="flex gap-2 mb-4">
                    <button onclick="addCategory()" class="bg-emerald-600 hover:bg-emerald-700 px-5 py-2 rounded-xl text-sm font-bold">إضافة</button>
                    <input type="text" id="new-category-name" placeholder="اسم القسم الجديد" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-emerald-500 text-right">
                </div>
                <div id="categories-list" class="space-y-2 max-h-56 overflow-y-auto"></div>
            </section>

            <section class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-xl">
                <h2 class="text-xl font-bold mb-4 text-emerald-400 text-right">
                    إعدادات المتجر <i class="fa-solid fa-gears mr-2"></i>
                </h2>
                <form onsubmit="saveSettings(event)" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-300 text-right">اسم المتجر</label>
                        <input type="text" id="store-name-input" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 text-right">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-300 text-right">رقم هاتف الواتساب (لطلبات الزبائن)</label>
                        <input type="text" id="store-phone-input" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 text-right" placeholder="0927772012">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold mb-1 text-slate-300 text-right">رابط شعار المتجر (Logo URL)</label>
                        <input type="text" id="store-logo-input" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-emerald-500 text-right" placeholder="https://example.com/logo.png">
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 py-3 rounded-xl font-bold text-sm transition mt-2 shadow">حفظ الإعدادات</button>
                </form>
            </section>
        </div>
    </main>

    <script>
        // إعدادات الاتصال بـ Supabase (باستخدام المفتاح الجديد الصحيح)
        const SUPABASE_URL = 'https://aqfokdrpdxhnxqqgrcha.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_c7pqgVERYX42JKqkRlEDNw_FihIV...'; // ضع مفتاحك الجديد كاملاً هنا
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let products = [];
        let categories = ["عطور", "إلكترونيات", "ملابس"];
        let settings = { name: "متجر البراء", logo: "", phone: "0927772012" };
        let tempColors = [];
        let tempSizes = [];

        async function initAdmin() {
            await loadDataFromSupabase();
            renderCategoriesOptions();
            renderCategoriesList();
            renderAdminProducts();
            
            document.getElementById('store-name-input').value = settings.name || "متجر البراء";
            document.getElementById('store-phone-input').value = settings.phone || "0927772012";
            document.getElementById('store-logo-input').value = settings.logo || "";
        }

        async function loadDataFromSupabase() {
            try {
                // جلب المنتجات
                const { data: dbProducts, error: pError } = await supabaseClient.from('products').select('*');
                if (!pError && dbProducts) {
                    products = dbProducts;
                }

                // جلب الإعدادات
                const { data: dbSettings, error: sError } = await supabaseClient.from('settings').select('*').limit(1);
                if (!sError && dbSettings && dbSettings.length > 0) {
                    settings = dbSettings[0];
                }

                // استخراج الأقسام من المنتجات أو الاعتماد على الافتراضية
                let derivedCats = [...new Set(products.map(p => p.category).filter(Boolean))];
                if(derivedCats.length > 0) {
                    categories = derivedCats;
                }
            } catch (e) {
                console.error("Error connecting to Supabase", e);
            }
        }

        function renderCategoriesOptions() {
            const select = document.getElementById('p-category');
            select.innerHTML = '';
            categories.forEach(cat => { select.innerHTML += `<option value="${cat}">${cat}</option>`; });
        }

        function renderCategoriesList() {
            const list = document.getElementById('categories-list');
            list.innerHTML = '';
            categories.forEach(cat => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-900 p-3 rounded-xl border border-slate-700 text-sm">
                        <button onclick="deleteCategory('${cat}')" class="text-rose-400 hover:text-rose-300 text-xs font-bold">حذف</button>
                        <span>${cat}</span>
                    </div>
                `;
            });
        }

        async function addCategory() {
            const input = document.getElementById('new-category-name');
            const name = input.value.trim();
            if(name && !categories.includes(name)) {
                categories.push(name);
                input.value = '';
                renderCategoriesOptions();
                renderCategoriesList();
                alert('تمت إضافة القسم بنجاح (سيظهر عند إضافة أول منتج فيه)');
            }
        }

        function deleteCategory(cat) {
            if(confirm(`هل أنت متأكد من حذف القسم "${cat}"؟`)) {
                categories = categories.filter(c => c !== cat);
                renderCategoriesOptions();
                renderCategoriesList();
            }
        }

        function addColor() {
            const input = document.getElementById('new-color-input');
            const val = input.value.trim();
            if(val) {
                val.split(',').map(i => i.trim()).filter(i => i.length > 0).forEach(item => {
                    if(!tempColors.includes(item)) tempColors.push(item);
                });
                input.value = '';
                renderColorsTags();
            }
        }
        function removeColor(c) { tempColors = tempColors.filter(item => item !== c); renderColorsTags(); }
        function renderColorsTags() {
            document.getElementById('colors-tags').innerHTML = tempColors.map(c => `
                <span class="bg-emerald-900 text-emerald-300 text-xs px-3 py-1.5 rounded-lg flex items-center gap-2 border border-emerald-700">
                    <button type="button" onclick="removeColor('${c}')" class="text-rose-400 font-bold">&times;</button>${c}
                </span>
            `).join('');
        }

        function addSize() {
            const input = document.getElementById('new-size-input');
            const val = input.value.trim();
            if(val) {
                val.split(',').map(i => i.trim()).filter(i => i.length > 0).forEach(item => {
                    if(!tempSizes.includes(item)) tempSizes.push(item);
                });
                input.value = '';
                renderSizesTags();
            }
        }
        function removeSize(s) { tempSizes = tempSizes.filter(item => item !== s); renderSizesTags(); }
        function renderSizesTags() {
            document.getElementById('sizes-tags').innerHTML = tempSizes.map(s => `
                <span class="bg-emerald-900 text-emerald-300 text-xs px-3 py-1.5 rounded-lg flex items-center gap-2 border border-emerald-700">
                    <button type="button" onclick="removeSize('${s}')" class="text-rose-400 font-bold">&times;</button>${s}
                </span>
            `).join('');
        }

        async function saveProduct(e) {
            e.preventDefault();
            const editId = document.getElementById('edit-id').value;
            const name = document.getElementById('p-name').value;
            const price = parseFloat(document.getElementById('p-price').value) || 0;
            const category = document.getElementById('p-category').value;
            const status = document.getElementById('p-status').value;
            const discount = parseFloat(document.getElementById('p-discount').value) || 0;
            const desc = document.getElementById('p-desc').value;
            const imageUrl = document.getElementById('p-image-url').value.trim();

            let productData = {
                name,
                price,
                category,
                status,
                discount,
                desc,
                colors: [...tempColors],
                sizes: [...tempSizes],
                image: imageUrl || 'https://via.placeholder.com/400'
            };

            if(editId) {
                const { error } = await supabaseClient.from('products').update(productData).eq('id', editId);
                if(error) {
                    alert('حدث خطأ أثناء التعديل: ' + error.message);
                    return;
                }
            } else {
                const { error } = await supabaseClient.from('products').insert([productData]);
                if(error) {
                    alert('حدث خطأ أثناء الإضافة: ' + error.message);
                    return;
                }
            }

            await loadDataFromSupabase();
            resetProductForm();
            renderAdminProducts();
            alert('تم حفظ المنتج في السحابة بنجاح!');
        }

        function renderAdminProducts() {
            const list = document.getElementById('admin-products-list');
            list.innerHTML = '';
            if(!products || products.length === 0) {
                list.innerHTML = `<div class="text-slate-400 text-sm text-center py-4">لا توجد منتجات مضافة حالياً.</div>`;
                return;
            }

            products.forEach((p) => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-slate-900 p-4 rounded-2xl border border-slate-700 gap-3">
                        <div class="flex gap-2">
                            <button onclick="editProduct('${p.id}')" class="bg-amber-500/20 hover:bg-amber-500 text-amber-400 hover:text-slate-900 px-3 py-1.5 rounded-xl text-xs font-bold transition">تعديل</button>
                            <button onclick="deleteProduct('${p.id}')" class="bg-rose-500/20 hover:bg-rose-500 text-rose-400 hover:text-white px-3 py-1.5 rounded-xl text-xs font-bold transition">حذف</button>
                        </div>
                        <div class="flex items-center space-x-3 space-x-reverse text-right">
                            <div>
                                <h4 class="font-bold text-white text-sm">${p.name}</h4>
                                <span class="text-amber-400 text-xs">${p.price} د.ل | ${p.category} | ${p.status}</span>
                            </div>
                            <img src="${p.image || 'https://via.placeholder.com/150'}" class="w-12 h-12 object-cover rounded-xl bg-slate-800">
                        </div>
                    </div>
                `;
            });
        }

        function editProduct(id) {
            const p = products.find(item => item.id == id);
            if(!p) return;

            document.getElementById('edit-id').value = p.id;
            document.getElementById('p-name').value = p.name;
            document.getElementById('p-price').value = p.price;
            document.getElementById('p-category').value = p.category;
            document.getElementById('p-status').value = p.status;
            document.getElementById('p-discount').value = p.discount || "";
            document.getElementById('p-desc').value = p.desc;
            document.getElementById('p-image-url').value = p.image || "";
            
            tempColors = Array.isArray(p.colors) ? [...p.colors] : (typeof p.colors === 'string' ? p.colors.split(',') : []);
            tempSizes = Array.isArray(p.sizes) ? [...p.sizes] : (typeof p.sizes === 'string' ? p.sizes.split(',') : []);
            renderColorsTags();
            renderSizesTags();

            document.getElementById('form-title').innerHTML = `تعديل المنتج: ${p.name} <i class="fa-solid fa-pen-to-square mr-2"></i>`;
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetProductForm() {
            document.getElementById('product-form').reset();
            document.getElementById('edit-id').value = "";
            tempColors = [];
            tempSizes = [];
            renderColorsTags();
            renderSizesTags();
            document.getElementById('form-title').innerHTML = `إضافة منتج جديد <i class="fa-solid fa-circle-plus mr-2"></i>`;
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        async function deleteProduct(id) {
            if(confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                const { error } = await supabaseClient.from('products').delete().eq('id', id);
                if(error) {
                    alert('خطأ في الحذف: ' + error.message);
                    return;
                }
                await loadDataFromSupabase();
                renderAdminProducts();
                alert('تم حذف المنتج بنجاح');
            }
        }

        async function saveSettings(e) {
            e.preventDefault();
            const name = document.getElementById('store-name-input').value;
            const phone = document.getElementById('store-phone-input').value;
            const logo = document.getElementById('store-logo-input').value;

            let settingsData = { id: 1, name, phone, logo };

            const { error } = await supabaseClient.from('settings').upsert([settingsData]);
            if(error) {
                alert('خطأ في حفظ الإعدادات: ' + error.message);
                return;
            }

            settings = settingsData;
            alert('تم حفظ إعدادات المتجر في السحابة بنجاح!');
        }

        window.onload = initAdmin;
    </script>
</body>
</html>
