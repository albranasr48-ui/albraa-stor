<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - المتجر الإلكتروني</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 min-h-screen flex flex-col md:flex-row">

    <!-- الأقسام الجانبية (يمين) -->
    <aside class="w-full md:w-64 bg-slate-900 text-white flex-shrink-0 flex flex-col justify-between shadow-lg">
        <div>
            <div class="p-5 border-b border-slate-800 flex items-center gap-3">
                <i class="fa-solid fa-gauge-high text-indigo-400 text-2xl"></i>
                <h1 class="font-bold text-lg">لوحة التحكم</h1>
            </div>
            <nav class="p-4 space-y-2">
                <button onclick="switchTab('products')" id="tab-btn-products" class="w-full text-right px-4 py-3 rounded-xl font-bold flex items-center gap-3 transition bg-indigo-600 text-white">
                    <i class="fa-solid fa-box"></i> إدارة المنتجات
                </button>
                <button onclick="switchTab('categories')" id="tab-btn-categories" class="w-full text-right px-4 py-3 rounded-xl font-bold flex items-center gap-3 transition text-slate-300 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-folder-tree"></i> إدارة الأقسام
                </button>
                <button onclick="switchTab('settings')" id="tab-btn-settings" class="w-full text-right px-4 py-3 rounded-xl font-bold flex items-center gap-3 transition text-slate-300 hover:bg-slate-800 hover:text-white">
                    <i class="fa-solid fa-gear"></i> إعدادات المتجر
                </button>
            </nav>
        </div>
        <div class="p-4 border-t border-slate-800 text-xs text-slate-400 text-center">
            مزامنة فورية لكل الأجهزة نشطة
        </div>
    </aside>

    <!-- المحتوى الرئيسي للوحة التحكم -->
    <main class="flex-grow p-6 overflow-y-auto">
        
        <!-- قسم المنتجات -->
        <div id="tab-products" class="tab-content">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                <h2 class="text-2xl font-bold text-gray-900">إدارة المنتجات</h2>
                <button onclick="openProductModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-bold shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> إضافة منتج جديد
                </button>
            </div>

            <!-- جدول المنتجات المضافة -->
            <div class="bg-white rounded-2xl shadow-sm border overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-right border-collapse">
                        <thead>
                            <tr class="bg-gray-50 border-b text-gray-600 text-sm">
                                <th class="p-4">الصورة</th>
                                <th class="p-4">اسم المنتج</th>
                                <th class="p-4">القسم</th>
                                <th class="p-4">السعر</th>
                                <th class="p-4">الحالة</th>
                                <th class="p-4 text-center">الإجراءات</th>
                            </tr>
                        </thead>
                        <tbody id="admin-products-table">
                            <!-- تعبئة ديناميكية -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- قسم الأقسام -->
        <div id="tab-categories" class="tab-content hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-gray-900">إدارة الأقسام</h2>
                <button onclick="openCategoryModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-bold shadow transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> إضافة قسم جديد
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border p-6 max-w-2xl">
                <div id="admin-categories-list" class="space-y-3">
                    <!-- تعبئة ديناميكية -->
                </div>
            </div>
        </div>

        <!-- قسم الإعدادات -->
        <div id="tab-settings" class="tab-content hidden">
            <h2 class="text-2xl font-bold text-gray-900 mb-6">إعدادات المتجر</h2>
            <div class="bg-white rounded-2xl shadow-sm border p-6 max-w-xl">
                <form id="settings-form" onsubmit="saveSettings(event)" class="space-y-4">
                    <div>
                        <label class="block text-sm font-semibold mb-1">اسم المتجر</label>
                        <input type="text" id="setting-store-name" required class="w-full border rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">رقم الهاتف لاستلام الطلبات (واتساب)</label>
                        <input type="tel" id="setting-store-phone" required class="w-full border rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">شعار المتجر (ارفاق صورة)</label>
                        <input type="file" id="setting-store-logo-file" accept="image/*" onchange="previewLogo(event)" class="w-full border rounded-xl px-3 py-2 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                        <div id="logo-preview-container" class="mt-3"></div>
                    </div>
                    <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold transition shadow-md">
                        حفظ الإعدادات
                    </button>
                </form>
            </div>
        </div>

    </main>

    <!-- نافذة إضافة / تعديل منتج -->
    <div id="product-modal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-lg w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
            <div class="p-4 bg-gray-100 flex justify-between items-center border-b">
                <h3 id="product-modal-title" class="font-bold text-lg text-gray-800">إضافة منتج جديد</h3>
                <button onclick="closeProductModal()" class="text-gray-500 hover:text-gray-700 text-xl font-bold">&times;</button>
            </div>
            <div class="p-6 overflow-y-auto flex-grow">
                <form id="product-form" onsubmit="saveProduct(event)" class="space-y-4">
                    <input type="hidden" id="prod-id">
                    <div>
                        <label class="block text-sm font-semibold mb-1">اسم المنتج</label>
                        <input type="text" id="prod-name" required class="w-full border rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">القسم</label>
                        <select id="prod-category" required class="w-full border rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                            <!-- تعبئة الأقسام -->
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-semibold mb-1">السعر (د.ل)</label>
                            <input type="number" step="0.01" id="prod-price" required class="w-full border rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-semibold mb-1">تخفيض بالنسبة (%)</label>
                            <input type="number" min="0" max="100" id="prod-discount" value="0" class="w-full border rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">صورة المنتج (إرفاق ملف)</label>
                        <input type="file" id="prod-image-file" accept="image/*" onchange="previewProductImage(event)" class="w-full border rounded-xl px-3 py-2 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                        <div id="prod-img-preview" class="mt-2"></div>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">الوصف</label>
                        <textarea id="prod-desc" rows="3" class="w-full border rounded-xl px-3 py-2 focus:outline-none focus:border-indigo-500"></textarea>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-1">الحالة</label>
                        <select id="prod-status" class="w-full border rounded-xl px-3 py-2">
                            <option value="available">متوفر</option>
                            <option value="unavailable">غير متوفر</option>
                        </select>
                    </div>

                    <!-- الألوان -->
                    <div class="border-t pt-3">
                        <label class="block text-sm font-semibold mb-2">الألوان المتاحة</label>
                        <div class="flex gap-2 mb-2">
                            <input type="text" id="new-color-input" placeholder="أدخل اسم اللون (مثال: أحمر)" class="border rounded-xl px-3 py-1.5 text-sm flex-grow">
                            <button type="button" onclick="addColor()" class="bg-gray-800 text-white px-4 py-1.5 rounded-xl text-sm font-bold">إضافة لون</button>
                        </div>
                        <div id="colors-tags-container" class="flex flex-wrap gap-2"></div>
                    </div>

                    <!-- المقاسات -->
                    <div class="border-t pt-3">
                        <label class="block text-sm font-semibold mb-2">المقاسات المتاحة</label>
                        <div class="flex gap-2 mb-2">
                            <input type="text" id="new-size-input" placeholder="أدخل المقاس (مثال: XL)" class="border rounded-xl px-3 py-1.5 text-sm flex-grow">
                            <button type="button" onclick="addSize()" class="bg-gray-800 text-white px-4 py-1.5 rounded-xl text-sm font-bold">إضافة مقاس</button>
                        </div>
                        <div id="sizes-tags-container" class="flex flex-wrap gap-2"></div>
                    </div>

                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold transition shadow-md">
                        حفظ المنتج
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- سكربت التحكم والمزامنة -->
    <script>
        let db = {
            settings: { name: "متجري الإلكتروني", phone: "0927772012", logo: "" },
            categories: [
                { id: "1", name: "إلكترونيات" },
                { id: "2", name: "ملابس" }
            ],
            products: [
                { id: 101, name: "ساعة ذكية متطورة", category: "1", price: 150, discount: 10, image: "", status: "available", colors: ["أسود", "فضي"], sizes: ["سير واحد"], description: "ساعة ذكية ممتازة" },
                { id: 102, name: "قميص رجالي أنيق", category: "2", price: 75, discount: 0, image: "", status: "available", colors: ["أبيض", "أزرق"], sizes: ["L", "XL"], description: "قميص قطني مريح" }
            ],
            cart: []
        };

        let tempColors = [];
        let tempSizes = [];
        let tempProductImageBase64 = "";
        let tempLogoBase64 = "";

        function loadData() {
            const saved = localStorage.getItem('store_db');
            if (saved) {
                try { db = JSON.parse(saved); } catch (e) {}
            }
            if (!db.settings.phone) db.settings.phone = "0927772012";
            renderAdmin();
        }

        function saveData() {
            localStorage.setItem('store_db', JSON.stringify(db));
        }

        // التنقل بين علامات التبويب
        function switchTab(tabName) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tabName}`).classList.remove('hidden');

            ['products', 'categories', 'settings'].forEach(t => {
                const btn = document.getElementById(`tab-btn-${t}`);
                if (t === tabName) {
                    btn.className = "w-full text-right px-4 py-3 rounded-xl font-bold flex items-center gap-3 transition bg-indigo-600 text-white";
                } else {
                    btn.className = "w-full text-right px-4 py-3 rounded-xl font-bold flex items-center gap-3 transition text-slate-300 hover:bg-slate-800 hover:text-white";
                }
            });
        }

        function renderAdmin() {
            // إعدادات
            document.getElementById('setting-store-name').value = db.settings.name || "";
            document.getElementById('setting-store-phone').value = db.settings.phone || "0927772012";
            tempLogoBase64 = db.settings.logo || "";
            const logoPreview = document.getElementById('logo-preview-container');
            if (tempLogoBase64) {
                logoPreview.innerHTML = `<img src="${tempLogoBase64}" class="w-16 h-16 object-contain rounded-xl border">`;
            } else {
                logoPreview.innerHTML = '';
            }

            // جدول المنتجات
            const prodTable = document.getElementById('admin-products-table');
            if (!db.products || db.products.length === 0) {
                prodTable.innerHTML = `<tr><td colspan="6" class="text-center py-8 text-gray-400 font-semibold">لا توجد منتجات مضافة</td></tr>`;
            } else {
                let html = '';
                db.products.forEach(p => {
                    const catObj = db.categories.find(c => c.id === p.category);
                    const catName = catObj ? catObj.name : 'غير مصنف';
                    const imgTag = p.image ? `<img src="${p.image}" class="w-12 h-12 object-cover rounded-xl">` : `<div class="w-12 h-12 bg-gray-200 rounded-xl flex items-center justify-center text-gray-400"><i class="fa-solid fa-image"></i></div>`;
                    
                    html += `
                        <tr class="border-b hover:bg-gray-50">
                            <td class="p-4">${imgTag}</td>
                            <td class="p-4 font-bold text-gray-800">${p.name}</td>
                            <td class="p-4">
                                <select onchange="moveProductCategory(${p.id}, this.value)" class="border rounded-lg px-2 py-1 text-sm bg-white">
                                    ${db.categories.map(c => `<option value="${c.id}" ${c.id === p.category ? 'selected' : ''}>${c.name}</option>`).join('')}
                                </select>
                            </td>
                            <td class="p-4 text-indigo-600 font-bold">${p.price} د.ل</td>
                            <td class="p-4">
                                <select onchange="toggleProductStatus(${p.id}, this.value)" class="border rounded-lg px-2 py-1 text-sm font-bold ${p.status === 'available' ? 'text-emerald-600 bg-emerald-50' : 'text-red-600 bg-red-50'}">
                                    <option value="available" ${p.status === 'available' ? 'selected' : ''}>متوفر</option>
                                    <option value="unavailable" ${p.status === 'unavailable' ? 'selected' : ''}>غير متوفر</option>
                                </select>
                            </td>
                            <td class="p-4 text-center space-x-2 space-x-reverse">
                                <button onclick="editProduct(${p.id})" class="text-blue-500 hover:text-blue-700 px-2 py-1"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button onclick="deleteProduct(${p.id})" class="text-red-500 hover:text-red-700 px-2 py-1"><i class="fa-solid fa-trash"></i></button>
                            </td>
                        </tr>
                    `;
                });
                prodTable.innerHTML = html;
            }

            // قائمة الأقسام
            const catList = document.getElementById('admin-categories-list');
            let catHtml = '';
            (db.categories || []).forEach(cat => {
                catHtml += `
                    <div class="flex items-center justify-between p-3 bg-gray-50 border rounded-xl">
                        <span class="font-bold text-gray-800">${cat.name}</span>
                        <div class="space-x-2 space-x-reverse">
                            <button onclick="editCategory('${cat.id}')" class="text-blue-500 hover:text-blue-700 text-sm font-bold"><i class="fa-solid fa-pen"></i> تعديل</button>
                            <button onclick="deleteCategory('${cat.id}')" class="text-red-500 hover:text-red-700 text-sm font-bold"><i class="fa-solid fa-trash"></i> حذف</button>
                        </div>
                    </div>
                `;
            });
            catList.innerHTML = catHtml;
        }

        // --- إدارة المنتجات ---
        function openProductModal(prodId = null) {
            // تعبئة اختيار الأقسام
            const catSelect = document.getElementById('prod-category');
            catSelect.innerHTML = db.categories.map(c => `<option value="${c.id}">${c.name}</option>`).join('');

            tempColors = [];
            tempSizes = [];
            tempProductImageBase64 = "";
            document.getElementById('prod-img-preview').innerHTML = '';
            document.getElementById('new-color-input').value = '';
            document.getElementById('new-size-input').value = '';

            if (prodId) {
                const product = db.products.find(p => p.id === prodId);
                if (!product) return;
                document.getElementById('product-modal-title').innerText = 'تعديل المنتج';
                document.getElementById('prod-id').value = product.id;
                document.getElementById('prod-name').value = product.name;
                document.getElementById('prod-category').value = product.category;
                document.getElementById('prod-price').value = product.price;
                document.getElementById('prod-discount').value = product.discount || 0;
                document.getElementById('prod-desc').value = product.description || '';
                document.getElementById('prod-status').value = product.status || 'available';
                tempProductImageBase64 = product.image || '';
                if (tempProductImageBase64) {
                    document.getElementById('prod-img-preview').innerHTML = `<img src="${tempProductImageBase64}" class="w-16 h-16 object-cover rounded-xl border">`;
                }
                tempColors = [...(product.colors || [])];
                tempSizes = [...(product.sizes || [])];
            } else {
                document.getElementById('product-modal-title').innerText = 'إضافة منتج جديد';
                document.getElementById('product-form').reset();
                document.getElementById('prod-id').value = '';
            }
            renderTags();
            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function previewProductImage(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    tempProductImageBase64 = uploadEvent.target.result;
                    document.getElementById('prod-img-preview').innerHTML = `<img src="${tempProductImageBase64}" class="w-16 h-16 object-cover rounded-xl border">`;
                };
                reader.readAsDataURL(file);
            }
        }

        function addColor() {
            const val = document.getElementById('new-color-input').value.trim();
            if (val && !tempColors.includes(val)) {
                tempColors.push(val);
                document.getElementById('new-color-input').value = '';
                renderTags();
            }
        }

        function removeColor(c) {
            tempColors = tempColors.filter(item => item !== c);
            renderTags();
        }

        function addSize() {
            const val = document.getElementById('new-size-input').value.trim();
            if (val && !tempSizes.includes(val)) {
                tempSizes.push(val);
                document.getElementById('new-size-input').value = '';
                renderTags();
            }
        }

        function removeSize(s) {
            tempSizes = tempSizes.filter(item => item !== s);
            renderTags();
        }

        function renderTags() {
            document.getElementById('colors-tags-container').innerHTML = tempColors.map(c => `
                <span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-lg text-xs font-bold flex items-center gap-1">
                    ${c} <button type="button" onclick="removeColor('${c}')" class="hover:text-red-500">&times;</button>
                </span>
            `).join('');

            document.getElementById('sizes-tags-container').innerHTML = tempSizes.map(s => `
                <span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-lg text-xs font-bold flex items-center gap-1">
                    ${s} <button type="button" onclick="removeSize('${s}')" class="hover:text-red-500">&times;</button>
                </span>
            `).join('');
        }

        function saveProduct(e) {
            e.preventDefault();
            const idVal = document.getElementById('prod-id').value;
            const name = document.getElementById('prod-name').value;
            const category = document.getElementById('prod-category').value;
            const price = parseFloat(document.getElementById('prod-price').value);
            const discount = parseFloat(document.getElementById('prod-discount').value) || 0;
            const description = document.getElementById('prod-desc').value;
            const status = document.getElementById('prod-status').value;

            if (idVal) {
                const p = db.products.find(item => item.id == idVal);
                if (p) {
                    p.name = name;
                    p.category = category;
                    p.price = price;
                    p.discount = discount;
                    p.description = description;
                    p.status = status;
                    p.image = tempProductImageBase64;
                    p.colors = [...tempColors];
                    p.sizes = [...tempSizes];
                }
            } else {
                const newProduct = {
                    id: Date.now(),
                    name,
                    category,
                    price,
                    discount,
                    description,
                    status,
                    image: tempProductImageBase64,
                    colors: [...tempColors],
                    sizes: [...tempSizes]
                };
                if (!db.products) db.products = [];
                db.products.push(newProduct);
            }

            saveData();
            closeProductModal();
            renderAdmin();
        }

        function deleteProduct(id) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                db.products = db.products.filter(p => p.id !== id);
                saveData();
                renderAdmin();
            }
        }

        function toggleProductStatus(id, status) {
            const p = db.products.find(item => item.id === id);
            if (p) {
                p.status = status;
                saveData();
                renderAdmin();
            }
        }

        function moveProductCategory(id, newCat) {
            const p = db.products.find(item => item.id === id);
            if (p) {
                p.category = newCat;
                saveData();
                renderAdmin();
            }
        }

        // --- إدارة الأقسام ---
        function openCategoryModal() {
            const name = prompt('أدخل اسم القسم الجديد:');
            if (name && name.trim() !== '') {
                if (!db.categories) db.categories = [];
                db.categories.push({ id: Date.now().toString(), name: name.trim() });
                saveData();
                renderAdmin();
            }
        }

        function editCategory(id) {
            const cat = db.categories.find(c => c.id === id);
            if (!cat) return;
            const newName = prompt('تعديل اسم القسم:', cat.name);
            if (newName && newName.trim() !== '') {
                cat.name = newName.trim();
                saveData();
                renderAdmin();
            }
        }

        function deleteCategory(id) {
            if (confirm('هل أنت متأكد من حذف هذا القسم؟')) {
                db.categories = db.categories.filter(c => c.id !== id);
                saveData();
                renderAdmin();
            }
        }

        // --- الإعدادات ---
        function previewLogo(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(uploadEvent) {
                    tempLogoBase64 = uploadEvent.target.result;
                    document.getElementById('logo-preview-container').innerHTML = `<img src="${tempLogoBase64}" class="w-16 h-16 object-contain rounded-xl border">`;
                };
                reader.readAsDataURL(file);
            }
        }

        function saveSettings(e) {
            e.preventDefault();
            db.settings.name = document.getElementById('setting-store-name').value;
            db.settings.phone = document.getElementById('setting-store-phone').value;
            db.settings.logo = tempLogoBase64;
            saveData();
            alert('تم حفظ الإعدادات بنجاح ومزامنتها مع المتجر.');
            renderAdmin();
        }

        window.onload = loadData;
    </script>
</body>
</html>
